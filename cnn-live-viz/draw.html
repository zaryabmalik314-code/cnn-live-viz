<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INPUT TERMINAL — CNN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04070d;
    --phos:#3dfaff;
    --phos-dim:#0d5f6b;
    --amber:#ffb547;
    --violet:#8b6bff;
    --grid:rgba(61,250,255,.07);
    --text:#c8e6ec;
    --mute:#3d5a66;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--void);color:var(--text);
    font-family:'JetBrains Mono',monospace;-webkit-font-smoothing:antialiased}

  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 95% 70% at 50% 42%,#000 18%,transparent 80%);
    mask-image:radial-gradient(ellipse 95% 70% at 50% 42%,#000 18%,transparent 80%)}
  .scanlines{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.32;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 1px,transparent 1px 3px)}
  .vignette{position:fixed;inset:0;z-index:59;pointer-events:none;
    background:radial-gradient(ellipse 78% 62% at 50% 48%,transparent 42%,rgba(2,4,9,.88) 100%)}

  .bracket{position:fixed;width:20px;height:20px;z-index:40;pointer-events:none;
    border-color:var(--phos);opacity:.5}
  .bk-tl{top:12px;left:12px;border-top:2px solid;border-left:2px solid}
  .bk-tr{top:12px;right:12px;border-top:2px solid;border-right:2px solid}
  .bk-bl{bottom:12px;left:12px;border-bottom:2px solid;border-left:2px solid}
  .bk-br{bottom:12px;right:12px;border-bottom:2px solid;border-right:2px solid}

  .wrap{position:relative;z-index:20;height:100%;display:flex;flex-direction:column;
    align-items:center;padding:34px 22px 26px}

  .head{text-align:center;margin-bottom:6px}
  .glyph{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:1.15rem;
    letter-spacing:.2em;color:var(--phos);text-shadow:0 0 16px rgba(61,250,255,.45)}
  .sub{font-size:.54rem;letter-spacing:.32em;color:var(--mute);text-transform:uppercase;margin-top:5px}

  /* ---- pairing ---- */
  #pair{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%}
  .eyebrow{font-size:.56rem;letter-spacing:.36em;color:var(--mute);text-transform:uppercase}
  .code-frame{position:relative;padding:8px}
  .code-frame::before,.code-frame::after{content:'';position:absolute;width:13px;height:13px;border-color:var(--phos)}
  .code-frame::before{top:0;left:0;border-top:2px solid;border-left:2px solid}
  .code-frame::after{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid}
  #code{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:2.6rem;
    letter-spacing:.3em;text-align:center;width:220px;padding:16px 0 16px .3em;
    background:linear-gradient(180deg,rgba(61,250,255,.05),transparent);
    border:1px solid var(--phos-dim);color:var(--phos);outline:none;
    text-shadow:0 0 22px rgba(61,250,255,.45)}
  #code::placeholder{color:var(--phos-dim);text-shadow:none}
  #code:focus{border-color:var(--phos);box-shadow:0 0 26px rgba(61,250,255,.18) inset}

  .btn{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.26em;
    text-transform:uppercase;padding:15px 40px;background:transparent;
    border:1px solid var(--phos-dim);color:var(--phos);cursor:pointer;
    transition:background .18s,border-color .18s,box-shadow .18s}
  .btn:active{background:rgba(61,250,255,.1);border-color:var(--phos);
    box-shadow:0 0 22px rgba(61,250,255,.22)}
  .btn.ghost{border-color:rgba(61,250,255,.18);color:var(--mute)}
  .btn.ghost:active{border-color:var(--amber);color:var(--amber);background:rgba(255,181,71,.08)}

  /* ---- canvas stage ---- */
  #stage{flex:1;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;width:100%}

  .padwrap{position:relative}
  .padwrap::before,.padwrap::after{content:'';position:absolute;width:16px;height:16px;
    border-color:var(--phos);opacity:.7;pointer-events:none;z-index:2}
  .padwrap::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
  .padwrap::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}
  #pad{display:block;background:#000;border:1px solid var(--phos-dim);
    touch-action:none;width:86vw;max-width:340px;height:86vw;max-height:340px;
    box-shadow:0 0 46px rgba(61,250,255,.07) inset}
  .xh{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,transparent 49.7%,rgba(61,250,255,.1) 49.7% 50.3%,transparent 50.3%),
               linear-gradient(0deg,transparent 49.7%,rgba(61,250,255,.1) 49.7% 50.3%,transparent 50.3%)}

  .status{display:flex;align-items:center;gap:8px;font-size:.56rem;
    letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--mute)}
  .status.on{color:var(--amber)}
  .status.on .dot{background:var(--amber);box-shadow:0 0 10px var(--amber);
    animation:blip 1.6s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

  .hint{font-size:.54rem;letter-spacing:.2em;color:var(--phos-dim);text-transform:uppercase}
</style>
</head>
<body>
<div class="bg-grid"></div>
<span class="bracket bk-tl"></span><span class="bracket bk-tr"></span>
<span class="bracket bk-bl"></span><span class="bracket bk-br"></span>

<div class="wrap">
  <div class="head">
    <div class="glyph">INPUT TERMINAL</div>
    <div class="sub">handwriting capture</div>
  </div>

  <div id="pair">
    <div class="eyebrow">enter session code</div>
    <div class="code-frame">
      <input id="code" maxlength="4" placeholder="0000" inputmode="numeric" autocomplete="off">
    </div>
    <button class="btn" id="linkBtn">establish link</button>
  </div>

  <div id="stage">
    <div class="status on" id="stat"><span class="dot"></span><span id="statTxt">linked</span></div>
    <div class="padwrap">
      <canvas id="pad" width="300" height="300"></canvas>
      <div class="xh"></div>
    </div>
    <div class="hint">draw a digit — 0 through 9</div>
    <button class="btn ghost" id="clearBtn">clear buffer</button>
  </div>
</div>

<div class="vignette"></div>
<div class="scanlines"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket=null, drawing=false, lx=0, ly=0;

const pad=document.getElementById('pad'), ctx=pad.getContext('2d');
ctx.fillStyle='#000'; ctx.fillRect(0,0,300,300);
ctx.lineCap='round'; ctx.lineJoin='round';
ctx.strokeStyle='#3dfaff'; ctx.lineWidth=22;
ctx.shadowColor='#3dfaff'; ctx.shadowBlur=14;

document.getElementById('linkBtn').onclick=()=>{
  const code=document.getElementById('code').value.trim();
  if(code.length<2) return;
  socket=io();
  socket.emit('join-room',code);
  socket.on('connect',()=>{
    document.getElementById('pair').style.display='none';
    document.getElementById('stage').style.display='flex';
    document.getElementById('statTxt').textContent='linked · '+code;
  });
  socket.on('disconnect',()=>{
    document.getElementById('stat').classList.remove('on');
    document.getElementById('statTxt').textContent='signal lost';
  });
};
document.getElementById('code').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('linkBtn').click();
});

function pos(e){
  const r=pad.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
  return [(t.clientX-r.left)*300/r.width,(t.clientY-r.top)*300/r.height];
}

function send(){
  const img=ctx.getImageData(0,0,300,300).data, px=[];
  const cell=300/28;
  for(let r=0;r<28;r++)for(let c=0;c<28;c++){
    let s=0,n=0;
    const y0=Math.floor(r*cell),y1=Math.floor((r+1)*cell);
    const x0=Math.floor(c*cell),x1=Math.floor((c+1)*cell);
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
      const i=(y*300+x)*4;
      // luminance from the phosphor stroke
      s+=Math.max(img[i],img[i+1],img[i+2]); n++;
    }
    px.push(s/n/255);
  }
  if(socket) socket.emit('pixel-update',px);
}

pad.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;[lx,ly]=pos(e)});
pad.addEventListener('pointermove',e=>{
  e.preventDefault(); if(!drawing) return;
  const [x,y]=pos(e);
  ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke();
  lx=x; ly=y;
  clearTimeout(window._t); window._t=setTimeout(send,70);
});
pad.addEventListener('pointerup',()=>{drawing=false;send()});
pad.addEventListener('pointerleave',()=>{drawing=false});

document.getElementById('clearBtn').onclick=()=>{
  ctx.shadowBlur=0;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,300,300);
  ctx.shadowBlur=14;
  if(socket) socket.emit('clear-canvas');
};
</script>
</body>
</html>
